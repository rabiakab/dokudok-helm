{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dokudok-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dokudok-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dokudok-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Ingress controller + Prometheus namespaces, and node/private IPs (hostPort traffic)
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 8080

  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (CloudNativePG cluster namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }}
      ports:
        - port: 5432
    # Keycloak / external HTTPS (OIDC token validation)
    - ports:
        - port: 443
    # Ingress controller pods (traffic to the public Keycloak name is DNATed to these ports)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        {{- range .Values.networkPolicy.ingressControllerPorts }}
        - port: {{ . }}
        {{- end }}
{{- end }}
