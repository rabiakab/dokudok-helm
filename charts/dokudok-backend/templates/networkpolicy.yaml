{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dokudok-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dokudok-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dokudok-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from ingress-nginx namespace (pod-network) or node IPs (hostNetwork DaemonSet)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 8080
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080

  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL — dokudok-db namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dokudok-db
      ports:
        - port: 5432
    # Keycloak / external HTTPS (OIDC token validation)
    - ports:
        - port: 443
{{- end }}
