replicaCount: 2

image:
  repository: ghcr.io/dokudok/backend
  pullPolicy: IfNotPresent
  tag: ""  # Overridden in env-specific values

imagePullSecrets:
  - name: ghcr-pull-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: api.dokudok.com
  # tls.enabled=false -> Traefik serves its default certificate (TLSStore, e.g. a wildcard).
  # tls.enabled=true  -> per-host certificate (add cert-manager.io/cluster-issuer annotation).
  tls:
    enabled: false
    secretName: dokudok-backend-tls

# Prometheus Operator ServiceMonitor for /management/prometheus
serviceMonitor:
  enabled: true
  interval: 60s
  labels:
    release: kps

# Non-sensitive environment variables rendered into ConfigMap
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://dokudok-db-rw.dokudok-db.svc.cluster.local:5432/dokudok"
  SPRING_DATASOURCE_USERNAME: "dokudok"
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: "https://auth.dokudok.com/realms/jhipster"
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: "web_app"
  JHIPSTER_SECURITY_OAUTH2_AUDIENCE: "account,api://default"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_STEP: "60"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+AlwaysPreTouch"
  SERVER_PORT: "8080"

# Secret name containing sensitive env vars
# Must exist before helm install (created via sops decrypt)
existingSecret: dokudok-backend-secrets

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# startupProbe covers the slow JVM/Liquibase start (up to 5 min); liveness/readiness stay tight afterwards.
startupProbe:
  httpGet:
    path: /management/health/liveness
    port: 8080
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /management/health/liveness
    port: 8080
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /management/health/readiness
    port: 8080
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

# Rolling update — zero downtime
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 60

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Who may reach :8080 — the ingress controller's namespace (k3s Traefik lives in kube-system) and the
  # node/private CIDR (Traefik hostPort traffic arrives with a node IP).
  ingressNamespaces: [kube-system, monitoring]
  ingressCidrs: [10.0.0.0/8]
  databaseNamespace: dokudok-db
  # Egress to the ingress controller pods: the backend calls Keycloak by its public name, which lands on
  # Traefik's hostPort and is DNATed to the Traefik pod ports BEFORE the policy is evaluated.
  ingressControllerNamespace: kube-system
  ingressControllerPorts: [8443, 8000]

# Spread replicas across nodes; ScheduleAnyway keeps single-node staging schedulable.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: dokudok-backend

affinity: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
